name: Deploy site

# Plain HTML: copy the page and its assets to the gh-pages branch that GitHub Pages serves.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html assets _site/ && touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
